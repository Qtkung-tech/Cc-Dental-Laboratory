<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Golden Robot Lab</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b0f19;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #info {
      position: absolute;
      top: 10px;
      left: 10px;
      color: #ffe17d;
      font-family: Arial, sans-serif;
      z-index: 100;
      background: rgba(11, 15, 25, 0.8);
      padding: 15px;
      border: 2px solid #f3be36;
      border-radius: 5px;
      max-width: 300px;
    }
    #stats {
      position: absolute;
      bottom: 10px;
      right: 10px;
      color: #00f2fe;
      font-family: Arial, sans-serif;
      z-index: 100;
      background: rgba(11, 15, 25, 0.8);
      padding: 15px;
      border: 2px solid #00f2fe;
      border-radius: 5px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div id="info">
    <h2 style="margin: 0 0 10px 0;">🤖 Golden Robot Lab</h2>
    <p style="margin: 0; font-size: 12px;">Drag to rotate • Scroll to zoom<br>Watch your minions work!</p>
  </div>
  <div id="stats">
    <div>Total Robots: <span id="total">0</span></div>
    <div>Station 1: <span id="s1">0</span></div>
    <div>Station 2: <span id="s2">0</span></div>
    <div>Station 3: <span id="s3">0</span></div>
    <div>Station 4: <span id="s4">0</span></div>
    <div>Station 5: <span id="s5">0</span></div>
    <div>Station 6: <span id="s6">0</span></div>
  </div>

  <script async src="https://cdn.jsdelivr.net/npm/three@r128/build/three.min.js"></script>
  <script async src="https://cdn.jsdelivr.net/npm/three@r128/examples/js/controls/OrbitControls.js"></script>

  <script>
    let scene, camera, renderer, controls;
    let robots = [];
    let ready = false;

    function checkReady() {
      if (typeof THREE !== 'undefined' && ready === false) {
        ready = true;
        init();
      } else if (!ready) {
        setTimeout(checkReady, 100);
      }
    }

    function init() {
      // Scene
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0b0f19);
      scene.fog = new THREE.Fog(0x0b0f19, 150, 200);

      // Camera
      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 25, 30);

      // Renderer
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.shadowMap.enabled = true;
      document.body.appendChild(renderer.domElement);

      // Controls
      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.enablePan = true;

      // Lighting
      const ambLight = new THREE.AmbientLight(0xffffff, 0.7);
      scene.add(ambLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
      dirLight.position.set(30, 50, 30);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 2048;
      dirLight.shadow.mapSize.height = 2048;
      dirLight.shadow.camera.far = 300;
      scene.add(dirLight);

      // Ground plane
      const groundGeo = new THREE.PlaneGeometry(100, 100);
      const groundMat = new THREE.MeshStandardMaterial({ color: 0x1a1f2e, roughness: 0.8 });
      const ground = new THREE.Mesh(groundGeo, groundMat);
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      scene.add(ground);

      // Grid
      const gridHelper = new THREE.GridHelper(100, 50, 0x2a3f5f, 0x1a2f4f);
      gridHelper.position.y = 0.01;
      scene.add(gridHelper);

      // Create stations and robots
      createStations();

      // Animation loop
      animate();

      // Handle resize
      window.addEventListener('resize', onWindowResize);
    }

    function createStations() {
      const stations = [
        { x: -15, z: 0, label: "Mail", count: 3, color: 0xf3be36 },
        { x: -8, z: -12, label: "Tracker", count: 2, color: 0xf3be36 },
        { x: 0, z: 0, label: "Work", count: 4, color: 0x00f2fe },
        { x: 8, z: -12, label: "QC", count: 3, color: 0x00f2fe },
        { x: 15, z: 0, label: "Bill", count: 2, color: 0xff6b6b },
        { x: -5, z: 12, label: "Ship", count: 3, color: 0x2ed573 }
      ];

      stations.forEach((st, idx) => {
        createStationPod(st.x, st.z, st.label, st.color);
        for (let i = 0; i < st.count; i++) {
          const angle = (Math.PI * 2 / st.count) * i;
          const bx = st.x + Math.cos(angle) * 3.5;
          const bz = st.z + Math.sin(angle) * 3.5;
          createRobot(bx, bz, st.x, st.z, idx + 1);
        }
      });
    }

    function createStationPod(x, z, label, color) {
      const group = new THREE.Group();

      // Base
      const baseGeo = new THREE.CylinderGeometry(4, 4, 0.4, 32);
      const baseMat = new THREE.MeshStandardMaterial({ color: color, metalness: 0.6, roughness: 0.3 });
      const base = new THREE.Mesh(baseGeo, baseMat);
      base.position.y = 0.2;
      base.castShadow = true;
      base.receiveShadow = true;
      group.add(base);

      // Structure
      const structGeo = new THREE.BoxGeometry(3.5, 2, 3.5);
      const structMat = new THREE.MeshStandardMaterial({ color: 0x1b2845, metalness: 0.4 });
      const struct = new THREE.Mesh(structGeo, structMat);
      struct.position.y = 1.5;
      struct.castShadow = true;
      struct.receiveShadow = true;
      group.add(struct);

      // Roof
      const roofGeo = new THREE.ConeGeometry(2.5, 1.2, 8);
      const roofMat = new THREE.MeshStandardMaterial({ color: 0xdae2ed, metalness: 0.5 });
      const roof = new THREE.Mesh(roofGeo, roofMat);
      roof.position.y = 2.8;
      roof.castShadow = true;
      group.add(roof);

      group.position.set(x, 0, z);
      scene.add(group);
    }

    function createRobot(x, z, homeX, homeZ, stationId) {
      const group = new THREE.Group();

      // Body - Golden sphere
      const bodyGeo = new THREE.SphereGeometry(0.5, 24, 24);
      const bodyMat = new THREE.MeshStandardMaterial({ color: 0xf3be36, metalness: 0.9, roughness: 0.15 });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.castShadow = true;
      body.receiveShadow = true;
      group.add(body);

      // Eyes
      const eyeGeo = new THREE.SphereGeometry(0.15, 12, 12);
      const eyeMat = new THREE.MeshBasicMaterial({ color: 0x00f2fe });

      const eye1 = new THREE.Mesh(eyeGeo, eyeMat);
      eye1.position.set(-0.2, 0.15, 0.45);
      group.add(eye1);

      const eye2 = new THREE.Mesh(eyeGeo, eyeMat);
      eye2.position.set(0.2, 0.15, 0.45);
      group.add(eye2);

      // Legs
      const legGeo = new THREE.SphereGeometry(0.1, 12, 12);
      const legMat = new THREE.MeshStandardMaterial({ color: 0xb88314, roughness: 0.5 });

      const leg1 = new THREE.Mesh(legGeo, legMat);
      leg1.position.set(-0.25, -0.4, 0.1);
      group.add(leg1);

      const leg2 = new THREE.Mesh(legGeo, legMat);
      leg2.position.set(0.25, -0.4, 0.1);
      group.add(leg2);

      group.position.set(x, 0.8, z);
      scene.add(group);

      robots.push({
        mesh: group,
        homeX, homeZ, stationId,
        angle: Math.random() * Math.PI * 2,
        speed: 0.7 + Math.random() * 0.5,
        leg1, leg2,
        time: 0
      });
    }

    function animate() {
      requestAnimationFrame(animate);

      const dt = 1 / 60;
      robots.forEach(r => {
        r.time += dt;
        r.angle += r.speed * dt * 0.4;

        const nx = r.homeX + Math.cos(r.angle) * 3.5;
        const nz = r.homeZ + Math.sin(r.angle) * 3.5;
        r.mesh.position.set(nx, 0.8 + Math.sin(r.time * 8) * 0.15, nz);
        r.mesh.rotation.y = r.angle;

        r.leg1.position.z = Math.sin(r.time * 10) * 0.08;
        r.leg2.position.z = -Math.sin(r.time * 10) * 0.08;
      });

      // Update stats
      document.getElementById('total').textContent = robots.length;
      for (let i = 1; i <= 6; i++) {
        const count = robots.filter(r => r.stationId === i).length;
        document.getElementById(`s${i}`).textContent = count;
      }

      controls.update();
      renderer.render(scene, camera);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    checkReady();
  </script>
</body>
</html>

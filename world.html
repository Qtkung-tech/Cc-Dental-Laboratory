<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robot Lab World</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05070d; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  #stats {
    position: fixed; top: 12px; left: 12px; min-width: 190px;
    background: rgba(10, 18, 30, 0.8); border: 1px solid #22d3ee55; border-radius: 10px;
    color: #d8f7ff; padding: 12px 14px; font-size: 14px; backdrop-filter: blur(6px);
  }
  #stats h3 { margin: 0 0 8px; font-size: 15px; color: #22d3ee; }
  .row { display: flex; justify-content: space-between; align-items: center; padding: 3px 0; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; }
  .total { border-top: 1px solid #22d3ee44; margin-top: 6px; padding-top: 6px; font-weight: 600; }
  #hint { position: fixed; bottom: 10px; width: 100%; text-align: center; color: #7fa4b3; font-size: 12px; pointer-events: none; }
</style>
</head>
<body>
<div id="stats"></div>
<div id="hint">Drag to rotate · Scroll to zoom · Right-drag to pan</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ---------- Config ----------
const TOTAL_ROBOTS = 17; // spread across the stations
const STATIONS = [
  { name: 'Mail',        color: 0x60a5fa },
  { name: 'Lab Tracker', color: 0xa78bfa },
  { name: 'Workstation', color: 0x34d399 },
  { name: 'QC',          color: 0xfbbf24 },
  { name: 'Billing',     color: 0xf472b6 },
  { name: 'Shipping',    color: 0xfb923c },
];
const LAYOUT_RADIUS = 16;
const WALK_RADIUS = 4.2;

// ---------- Scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05070d);
scene.fog = new THREE.Fog(0x05070d, 40, 90);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 26, 34);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI / 2.05;
controls.minDistance = 8;
controls.maxDistance = 70;

scene.add(new THREE.AmbientLight(0x6688aa, 0.5));
const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(10, 25, 10);
scene.add(sun);

// ---------- Floor ----------
const floor = new THREE.Mesh(
  new THREE.CircleGeometry(60, 64).rotateX(-Math.PI / 2),
  new THREE.MeshStandardMaterial({ color: 0x0a0f18, roughness: 0.6, metalness: 0.4 })
);
scene.add(floor);
const grid = new THREE.GridHelper(120, 60, 0x22d3ee, 0x123044);
grid.position.y = 0.02;
grid.material.transparent = true;
grid.material.opacity = 0.5;
scene.add(grid);

// ---------- Helpers ----------
function makeLabel(text, color) {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = 'rgba(8,14,24,0.85)';
  g.fillRect(0, 0, 512, 128);
  g.strokeStyle = '#' + color.toString(16).padStart(6, '0');
  g.lineWidth = 6;
  g.strokeRect(3, 3, 506, 122);
  g.fillStyle = '#fff';
  g.font = 'bold 60px system-ui, sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(text, 256, 68);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true }));
  s.scale.set(5, 1.25, 1);
  return s;
}

// ---------- Stations ----------
const stationGroups = [];
STATIONS.forEach((st, i) => {
  const a = (i / STATIONS.length) * Math.PI * 2;
  const g = new THREE.Group();
  g.position.set(Math.cos(a) * LAYOUT_RADIUS, 0, Math.sin(a) * LAYOUT_RADIUS);

  const base = new THREE.Mesh(
    new THREE.CylinderGeometry(2.2, 2.6, 0.5, 40),
    new THREE.MeshStandardMaterial({ color: 0x1b2433, metalness: 0.8, roughness: 0.3 })
  );
  base.position.y = 0.25;
  g.add(base);

  const glowMat = new THREE.MeshStandardMaterial({
    color: st.color, emissive: st.color, emissiveIntensity: 1.5
  });
  const ring = new THREE.Mesh(new THREE.TorusGeometry(2.4, 0.07, 12, 64).rotateX(Math.PI / 2), glowMat);
  ring.position.y = 0.52;
  g.add(ring);

  const body = new THREE.Mesh(
    new THREE.BoxGeometry(2, 1.6, 2),
    new THREE.MeshStandardMaterial({ color: 0x263247, metalness: 0.7, roughness: 0.35 })
  );
  body.position.y = 1.3;
  g.add(body);

  const screen = new THREE.Mesh(new THREE.PlaneGeometry(1.4, 0.8), glowMat);
  screen.position.set(0, 1.5, 1.01);
  g.add(screen);

  const dome = new THREE.Mesh(
    new THREE.SphereGeometry(0.7, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2),
    new THREE.MeshStandardMaterial({ color: st.color, transparent: true, opacity: 0.6, emissive: st.color, emissiveIntensity: 0.5 })
  );
  dome.position.y = 2.1;
  g.add(dome);

  const light = new THREE.PointLight(st.color, 25, 14);
  light.position.y = 3;
  g.add(light);

  const label = makeLabel(st.name, st.color);
  label.position.y = 4;
  g.add(label);

  // face center
  body.lookAt(0, body.position.y, 0);
  screen.position.set(0, 1.5, 0);
  screen.rotation.y = body.rotation.y;
  screen.translateZ(1.01);

  scene.add(g);
  stationGroups.push(g);
});

// ---------- Robots ----------
const goldMat = new THREE.MeshStandardMaterial({ color: 0xffc933, metalness: 1, roughness: 0.15 });
const eyeMat = new THREE.MeshStandardMaterial({ color: 0x00ffff, emissive: 0x00ffff, emissiveIntensity: 3 });
const legMat = new THREE.MeshStandardMaterial({ color: 0x6b3f1d, roughness: 0.8 });
const bodyGeo = new THREE.SphereGeometry(0.5, 32, 24);
const eyeGeo = new THREE.SphereGeometry(0.09, 12, 12);
const legGeo = new THREE.CylinderGeometry(0.06, 0.06, 0.45, 8).translate(0, -0.225, 0);

function makeRobot() {
  const r = new THREE.Group();
  const body = new THREE.Mesh(bodyGeo, goldMat);
  body.position.y = 0.85;
  r.add(body);
  for (const x of [-0.17, 0.17]) {
    const eye = new THREE.Mesh(eyeGeo, eyeMat);
    eye.position.set(x, 0.95, 0.44);
    r.add(eye);
  }
  const legs = [];
  for (const x of [-0.18, 0.18]) {
    const leg = new THREE.Mesh(legGeo, legMat);
    leg.position.set(x, 0.5, 0);
    r.add(leg);
    legs.push(leg);
  }
  r.userData.legs = legs;
  return r;
}

const counts = new Array(STATIONS.length).fill(0);
const robots = [];
for (let n = 0; n < TOTAL_ROBOTS; n++) {
  const s = n % STATIONS.length;
  counts[s]++;
  const mesh = makeRobot();
  scene.add(mesh);
  robots.push({
    mesh, station: s,
    angle: Math.random() * Math.PI * 2,
    speed: (0.35 + Math.random() * 0.25) * (Math.random() < 0.5 ? 1 : -1),
    radius: WALK_RADIUS + (Math.random() - 0.5) * 1.2,
    phase: Math.random() * 10,
  });
}

// ---------- Stats panel ----------
const statsEl = document.getElementById('stats');
statsEl.innerHTML = '<h3>Robots per Station</h3>' +
  STATIONS.map((s, i) =>
    `<div class="row"><span><span class="dot" style="background:#${s.color.toString(16).padStart(6, '0')}"></span>${s.name}</span><b>${counts[i]}</b></div>`
  ).join('') +
  `<div class="row total"><span>Total</span><b>${TOTAL_ROBOTS}</b></div>`;

// ---------- Animate ----------
const clock = new THREE.Clock();
function animate() {
  const dt = clock.getDelta();
  const t = clock.elapsedTime;
  for (const r of robots) {
    r.angle += r.speed * dt;
    const c = stationGroups[r.station].position;
    const x = c.x + Math.cos(r.angle) * r.radius;
    const z = c.z + Math.sin(r.angle) * r.radius;
    r.mesh.position.set(x, Math.abs(Math.sin(t * 8 + r.phase)) * 0.06, z);
    const dir = Math.sign(r.speed);
    const tx = -Math.sin(r.angle) * dir, tz = Math.cos(r.angle) * dir;
    r.mesh.rotation.y = Math.atan2(tx, tz);
    const swing = Math.sin(t * 8 + r.phase) * 0.6;
    r.mesh.userData.legs[0].rotation.x = swing;
    r.mesh.userData.legs[1].rotation.x = -swing;
  }
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>

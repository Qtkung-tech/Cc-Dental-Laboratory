<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cute Gold Bot Hex Village</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #0b0f19;
      font-family: 'Inter', system-ui, sans-serif;
      color: #fff;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
    }
    .ui-overlay {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      pointer-events: none;
      z-index: 10;
    }
    h1 {
      margin: 0;
      color: #ffe17d;
      font-size: 22px;
      text-shadow: 0 0 12px rgba(255, 225, 125, 0.4);
    }
    p {
      margin: 4px 0 0 0;
      color: #9aa0b4;
      font-size: 12px;
    }
    .info-panel {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(18, 22, 36, 0.88);
      border: 1px solid #f3be36;
      border-radius: 10px;
      padding: 10px 20px;
      display: flex;
      gap: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
      z-index: 10;
    }
    .badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      color: #ffe17d;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; }
    .dot-green { background: #2ed573; box-shadow: 0 0 6px #2ed573; }
    .dot-red { background: #ff4757; box-shadow: 0 0 6px #ff4757; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.com/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div class="ui-overlay">
    <h1>✨ Cute Gold Bot Hex Village</h1>
    <p>Drag to rotate view • Scroll to zoom • Cute round golden bots working at their station pods</p>
  </div>

  <div class="info-panel">
    <div class="badge"><div class="dot dot-green"></div> 1. Mail Intake</div>
    <div class="badge"><div class="dot dot-green"></div> 2. Lab Tracker</div>
    <div class="badge"><div class="dot dot-red"></div> 3. Workstation</div>
    <div class="badge"><div class="dot dot-red"></div> 4. QC Station</div>
    <div class="badge"><div class="dot dot-red"></div> 5. Billing Pod</div>
    <div class="badge"><div class="dot dot-green"></div> 6. Dispatch Pod</div>
  </div>

  <div id="canvas-container"></div>

  <script>
    // --- 1. SETUP & CAMERA ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b0f19);
    scene.fog = new THREE.FogExp2(0x0b0f19, 0.012);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 24, 26);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2 - 0.05;

    // --- 2. LIGHTING ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
    scene.add(ambientLight);

    const sun = new THREE.DirectionalLight(0xfffaed, 1.2);
    sun.position.set(15, 30, 15);
    sun.castShadow = true;
    sun.shadow.mapSize.width = 2048;
    sun.shadow.mapSize.height = 2048;
    scene.add(sun);

    // --- 3. MATERIALS ---
    const matHexSurface = new THREE.MeshStandardMaterial({ color: 0x212738, roughness: 0.7 });
    const matPodBody = new THREE.MeshStandardMaterial({ color: 0xdae2ed, roughness: 0.3 });
    const matPodRoof = new THREE.MeshStandardMaterial({ color: 0x1b2845, roughness: 0.2 });

    // Cute Gold Bot Specific Materials
    const matGoldBody = new THREE.MeshStandardMaterial({ 
      color: 0xf3be36, 
      metalness: 0.85, 
      roughness: 0.25 
    });
    const matBotGoggles = new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.8 });
    const matBotEye = new THREE.MeshBasicMaterial({ color: 0x00f2fe });
    const matFoot = new THREE.MeshStandardMaterial({ color: 0xb88314, roughness: 0.4 });

    // --- 4. HEXAGON TILE BUILDER ---
    function createHexTile(x, z, outlineColor) {
      const tileGroup = new THREE.Group();
      
      const radius = 3.6;
      const shape = new THREE.Shape();
      for (let i = 0; i < 6; i++) {
        const angle = (Math.PI / 3) * i;
        const hx = radius * Math.cos(angle);
        const hy = radius * Math.sin(angle);
        if (i === 0) shape.moveTo(hx, hy);
        else shape.lineTo(hx, hy);
      }
      shape.closePath();

      const extrudeSettings = { depth: 0.6, bevelEnabled: true, bevelSegments: 2, steps: 1, bevelSize: 0.15, bevelThickness: 0.15 };
      const geo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
      geo.rotateX(Math.PI / 2);

      const mesh = new THREE.Mesh(geo, matHexSurface);
      mesh.receiveShadow = true;
      tileGroup.add(mesh);

      // Colored Border Ring
      const ringGeo = new THREE.TorusGeometry(radius, 0.12, 6, 6);
      ringGeo.rotateX(Math.PI / 2);
      const ringMat = new THREE.MeshStandardMaterial({ color: outlineColor, metalness: 0.8, roughness: 0.2 });
      const ringMesh = new THREE.Mesh(ringGeo, ringMat);
      ringMesh.position.y = 0.32;
      tileGroup.add(ringMesh);

      tileGroup.position.set(x, 0, z);
      scene.add(tileGroup);
    }

    // --- 5. STATION POD HOUSE BUILDER ---
    function createStationPod(x, z) {
      const podGroup = new THREE.Group();

      const bodyGeo = new THREE.CylinderGeometry(1.4, 1.7, 1.2, 8);
      const bodyMesh = new THREE.Mesh(bodyGeo, matPodBody);
      bodyMesh.position.y = 0.9;
      bodyMesh.castShadow = true;
      bodyMesh.receiveShadow = true;
      podGroup.add(bodyMesh);

      const roofGeo = new THREE.BoxGeometry(1.1, 0.2, 1.1);
      const roofMesh = new THREE.Mesh(roofGeo, matPodRoof);
      roofMesh.position.y = 1.55;
      podGroup.add(roofMesh);

      const doorGeo = new THREE.BoxGeometry(0.5, 0.8, 0.3);
      const doorMesh = new THREE.Mesh(doorGeo, matPodRoof);
      doorMesh.position.set(0, 0.7, 1.5);
      podGroup.add(doorMesh);

      podGroup.position.set(x, 0, z);
      scene.add(podGroup);
    }

    // --- 6. CUTE ROUND GOLD BOT BUILDER ---
    const goldBots = [];

    function createCuteGoldBot(homeX, homeZ) {
      const botGroup = new THREE.Group();

      // Shiny Round Gold Sphere Body
      const bodyGeo = new THREE.SphereGeometry(0.45, 24, 24);
      const bodyMesh = new THREE.Mesh(bodyGeo, matGoldBody);
      bodyMesh.castShadow = true;
      botGroup.add(bodyMesh);

      // Dark Goggles Strap
      const bandGeo = new THREE.CylinderGeometry(0.46, 0.46, 0.12, 20);
      const bandMesh = new THREE.Mesh(bandGeo, matBotGoggles);
      bandMesh.position.y = 0.06;
      botGroup.add(bandMesh);

      // Glowing Eyes
      const eyeGeo = new THREE.SphereGeometry(0.12, 12, 12);
      
      const leftEye = new THREE.Mesh(eyeGeo, matBotEye);
      leftEye.position.set(-0.16, 0.06, 0.4);
      botGroup.add(leftEye);

      const rightEye = new THREE.Mesh(eyeGeo, matBotEye);
      rightEye.position.set(0.16, 0.06, 0.4);
      botGroup.add(rightEye);

      // Tiny Gold Feet
      const footGeo = new THREE.SphereGeometry(0.12, 12, 12);
      
      const leftFoot = new THREE.Mesh(footGeo, matFoot);
      leftFoot.position.set(-0.2, -0.4, 0.05);
      botGroup.add(leftFoot);

      const rightFoot = new THREE.Mesh(footGeo, matFoot);
      rightFoot.position.set(0.2, -0.4, 0.05);
      botGroup.add(rightFoot);

      botGroup.position.set(homeX, 0.5, homeZ);
      scene.add(botGroup);

      return {
        group: botGroup,
        leftFoot: leftFoot,
        rightFoot: rightFoot,
        homeX: homeX,
        homeZ: homeZ,
        angle: Math.random() * Math.PI * 2,
        radius: 1.8 + Math.random() * 0.7,
        speed: 0.9 + Math.random() * 0.5
      };
    }

    // --- 7. LAYOUT STATIONS & SPAWN BOTS ---
    const stationLayout = [
      { name: "Mail Intake", x: -11, z: 4, outline: 0xf3be36, count: 3 },
      { name: "Lab Tracker", x: -6.6, z: -3.5, outline: 0xf3be36, count: 2 },
      { name: "Workstation", x: -2.2, z: 4, outline: 0x00f2fe, count: 4 },
      { name: "QC Finishing", x: 2.2, z: -3.5, outline: 0x00f2fe, count: 3 },
      { name: "Billing", x: 6.6, z: 4, outline: 0xf3be36, count: 2 },
      { name: "Shipping", x: 11, z: -3.5, outline: 0x2ed573, count: 3 }
    ];

    stationLayout.forEach((st) => {
      createHexTile(st.x, st.z, st.outline);
      createStationPod(st.x, st.z);

      // Spawn cute round gold bots on every tile
      for (let i = 0; i < st.count; i++) {
        goldBots.push(createCuteGoldBot(st.x, st.z));
      }
    });

    // --- 8. ANIMATION LOOP ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const elapsed = clock.getElapsedTime();

      // Animate cute gold bots walking and bouncing around station pods
      goldBots.forEach((bot) => {
        bot.angle += bot.speed * delta;
        
        const targetX = bot.homeX + Math.cos(bot.angle) * bot.radius;
        const targetZ = bot.homeZ + Math.sin(bot.angle) * bot.radius;

        bot.group.position.x = targetX;
        bot.group.position.z = targetZ;
        bot.group.rotation.y = -bot.angle + Math.PI / 2;

        // Cute walking bounce motion
        bot.group.position.y = 0.5 + Math.abs(Math.sin(elapsed * 8 + bot.angle)) * 0.14;

        // Foot movement
        bot.leftFoot.position.z = Math.sin(elapsed * 10) * 0.08;
        bot.rightFoot.position.z = -Math.sin(elapsed * 10) * 0.08;
      });

      controls.update();
      renderer.render(scene, camera);
    }

    // --- 9. RESIZE HANDLER ---
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
